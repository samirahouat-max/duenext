<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DueNext — Student Deadline Tracker</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #1e293b;
      background: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; }
    main { max-width: 850px; margin: auto; }
    h1 { margin-bottom: 4px; }
    .subtitle { color: #64748b; margin-top: 0; }
    .panel, .assignment {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 18px;
      margin: 16px 0;
    }
    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    label { display: grid; gap: 5px; font-size: 14px; }
    input, select, button {
      font: inherit;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    button { cursor: pointer; background: white; }
    button.primary { background: #3157d5; color: white; border: 0; }
    .wide { grid-column: 1 / -1; }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; flex-wrap: wrap;
    }
    .assignment {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .assignment h3 { margin: 0 0 5px; }
    .assignment p { margin: 0; color: #64748b; font-size: 14px; }
    .actions { display: flex; gap: 8px; }
    .done { opacity: .55; }
    .done h3 { text-decoration: line-through; }
    .overdue { color: #b42318 !important; }
    #empty { color: #64748b; text-align: center; padding: 24px; }
    @media (max-width: 560px) {
      form { grid-template-columns: 1fr; }
      .wide { grid-column: auto; }
      .assignment { align-items: flex-start; }
    }
  </style>
</head>
<body>
<main>
  <h1>DueNext</h1>
  <p class="subtitle">A simple place to keep your assignments and deadlines together.</p>

  <section class="panel">
    <h2>Add an assignment</h2>
    <form id="assignment-form">
      <label>Assignment
        <input id="title" required maxlength="100" placeholder="e.g. Biology lab report">
      </label>
      <label>Course
        <input id="course" required maxlength="60" placeholder="e.g. Biology 101">
      </label>
      <label>Due date
        <input id="due" type="date" required>
      </label>
      <label>Priority
        <select id="priority">
          <option>Normal</option>
          <option>High</option>
          <option>Low</option>
        </select>
      </label>
      <button class="primary wide" type="submit">Add to tracker</button>
    </form>
  </section>

  <section>
    <div class="toolbar">
      <h2>Your assignments</h2>
      <div>
        <select id="filter" aria-label="Filter assignments">
          <option value="all">All assignments</option>
          <option value="active">Not completed</option>
          <option value="done">Completed</option>
        </select>
        <button id="export">Download CSV</button>
      </div>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
  const STORAGE_KEY = "duenext-assignments-v1";
  const form = document.querySelector("#assignment-form");
  const list = document.querySelector("#list");
  const filter = document.querySelector("#filter");

  let assignments = [];
  try {
    assignments = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (!Array.isArray(assignments)) assignments = [];
  } catch {
    assignments = [];
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(assignments));
    render();
  }

  function render() {
    list.replaceChildren();

    const shown = assignments
      .filter(item => filter.value === "all" ||
        (filter.value === "active" && !item.done) ||
        (filter.value === "done" && item.done))
      .sort((a, b) => a.due.localeCompare(b.due));

    if (!shown.length) {
      const empty = document.createElement("p");
      empty.id = "empty";
      empty.textContent = "No assignments here yet. Add one above.";
      list.append(empty);
      return;
    }

    for (const item of shown) {
      const card = document.createElement("article");
      card.className = "assignment" + (item.done ? " done" : "");

      const info = document.createElement("div");
      const title = document.createElement("h3");
      title.textContent = item.title;
      const details = document.createElement("p");
      details.textContent = `${item.course} · Due ${item.due} · ${item.priority}`;
      if (!item.done && item.due < new Date().toISOString().slice(0, 10)) {
        details.className = "overdue";
        details.textContent += " · Overdue";
      }
      info.append(title, details);

      const actions = document.createElement("div");
      actions.className = "actions";

      const toggle = document.createElement("button");
      toggle.textContent = item.done ? "Undo" : "Done";
      toggle.setAttribute("aria-label", `${item.done ? "Reopen" : "Complete"} ${item.title}`);
      toggle.addEventListener("click", () => {
        item.done = !item.done;
        save();
      });

      const remove = document.createElement("button");
      remove.textContent = "Delete";
      remove.setAttribute("aria-label", `Delete ${item.title}`);
      remove.addEventListener("click", () => {
        assignments = assignments.filter(a => a.id !== item.id);
        save();
      });

      actions.append(toggle, remove);
      card.append(info, actions);
      list.append(card);
    }
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    assignments.push({
      id: crypto.randomUUID(),
      title: document.querySelector("#title").value.trim(),
      course: document.querySelector("#course").value.trim(),
      due: document.querySelector("#due").value,
      priority: document.querySelector("#priority").value,
      done: false
    });
    form.reset();
    save();
  });

  filter.addEventListener("change", render);

  document.querySelector("#export").addEventListener("click", () => {
    const rows = [["Assignment", "Course", "Due date", "Priority", "Completed"]];
    for (const item of assignments) {
      rows.push([item.title, item.course, item.due, item.priority, item.done ? "Yes" : "No"]);
    }
    const csv = rows.map(row =>
      row.map(value => `"${String(value).replaceAll('"', '""')}"`).join(",")
    ).join("\n");

    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    link.download = "duenext-assignments.csv";
    link.click();
    URL.revokeObjectURL(link.href);
  });

  render();
</script>
</body>
</html>
